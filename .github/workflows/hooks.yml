name: Hooks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true

      - name: Validate hooks
        run: hk check --all
