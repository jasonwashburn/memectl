name: Hooks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install tools
        run: mise install

      - name: Validate hooks
        run: hk check --all
