name: Hooks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true

      - name: Validate hooks
        run: hk check --all
