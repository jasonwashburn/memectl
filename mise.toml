[tools]
go = "1.26.7"
golangci-lint = "2.13.1"
hk = "1.56.0"
node = "26.7.0"
"npm:@fission-ai/openspec" = "1.10.0"
zizmor = "1.29.0"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[tasks.fmt]
description = "Format Go source files"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run Go lint checks"
run = "golangci-lint run ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.coverage]
description = "Run Go tests with coverage"
run = "go test -cover ./..."

[tasks.build]
description = "Build the memectl executable"
run = """
mkdir -p build
go build -o build/memectl .
"""
