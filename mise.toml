[tools]
go = "1.26.7"
node = "26.7.0"
"npm:@fission-ai/openspec" = "1.10.0"

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.coverage]
description = "Run Go tests with coverage"
run = """
packages=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
if [ -z "$packages" ]; then
  echo "No test packages found"
  exit 0
fi
set -- $packages
go test -coverprofile=coverage.out "$@"
"""

[tasks.build]
description = "Build the memectl executable"
run = """
mkdir -p build
go build -o build/memectl .
"""
