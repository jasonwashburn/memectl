[tools]
go = "1.26.7"
golangci-lint = "2.13.1"
goreleaser = "2.17.1"
hk = "1.56.0"
node = "26.7.0"
"npm:@fission-ai/openspec" = "1.10.0"
zizmor = "1.29.0"

[env]
HK_MISE = "1"
MEME_STORE = "{{ config_root }}/.meme/memes.json"

[hooks]
postinstall = "hk install --mise"

[tasks.fmt]
description = "Format Go source files"
run = "golangci-lint fmt"

[tasks.check]
description = "Format and validate the project after changes"
run = [
  { task = "fmt" },
  { tasks = ["lint", "vet", "test", "build"] },
]

[tasks.lint]
description = "Run all lint checks"
depends = ["lint-go", "lint-workflows"]

[tasks.lint-go]
description = "Run Go lint checks"
run = "golangci-lint run ./..."

[tasks.lint-workflows]
description = "Run GitHub Actions workflow lint checks"
run = "zizmor .github/workflows"

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.coverage]
description = "Run Go tests with coverage"
run = "go test -cover ./..."

[tasks.build]
description = "Build the memectl executable"
run = """
mkdir -p build
go build -o build/memectl .
"""

[tasks.release-snapshot]
description = "Build release archives locally without publishing"
run = "goreleaser release --snapshot --clean"
