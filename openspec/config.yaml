context: |
  Project: memectl
  Repository: https://github.com/jasonwashburn/memectl
  Go module: github.com/jasonwashburn/memectl

  memectl is a hobby project for building a meme-generating CLI using
  Imgflip's HTTP API.

  Technical foundation:
  - Implementation language: Go
  - CLI framework: Cobra
  - Tool and runtime management: mise
  - Specification workflow: Fission-AI/OpenSpec
  - Imgflip integration uses its HTTP API; Imgflip does not provide an
    official Go SDK.

  CLI convention: memectl uses a kubectl-inspired structure:
  - memectl <verb> <resource> [name] [flags].

